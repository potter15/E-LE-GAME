        { question: "ข้อใดคือธาตุที่มีสัญลักษณ์ว่า v?", image: "img/23.png",  options:  ["Aluminum อลูมิเนียม", "Nitrogen ไนโตรเจน", "Vanadium วานาดียม", "argon อาร์กอน"], answer: "Vanadium วานาดียม" },

        { question: "ข้อใดคือธาตุที่มีสัญลักษณ์ว่า Cu?", image: "img/29.png",   options:  ["copper ทองแดง", "Aluminum อลูมิเนียม", "Vanadium วานาดียม", "argon อาร์กอน"], answer: "copper ทองแดง" },
        { question: "ข้อใดคือธาตุที่มีสัญลักษณ์ว่า Zn?", image: "img/30.png",   options:  ["zinc สังกะสี", "manganese แมงกานีส", "copper ทองแดง", "Vanadium วานาดียม"], answer: "zinc สังกะสี" }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    const answers = new Array(questions.length).fill(null); // Stores user answers

    const questionContainer = document.getElementById("question-container");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const submitBtn = document.getElementById("submit-btn");

    function speak(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speechSynthesis.speak(speech);
    }

    // Display question
    function displayQuestion(index) {
        const q = questions[index];
        questionContainer.innerHTML = `
            <div class="text-center mb-5">
                ${q.image ? `<img src="${q.image}" class="rounded mb-3" alt="Question Image" height="350">` : ""}
                <p><strong>${index + 1}. ${q.question}</strong></p>
            </div>
            <div class="text-center">
                ${q.options.map((opt, i) => `
                    <input type="radio" class="btn-check" name="q" id="opt${i}" value="${opt}" autocomplete="off">
                    <label class="btn btn-outline-primary m-5" for="opt${i}" onclick="checkAnswer('${opt}', '${q.answer}')">${opt}</label>
                `).join('')}
            </div>
            <p id="feedback" class="text-danger mt-3"></p>
        `;

        // Show/hide buttons
        prevBtn.style.display = index > 0 ? "inline-block" : "none";
        nextBtn.style.display = "none"; // Hide Next button initially
        submitBtn.style.display = index === questions.length - 1 ? "inline-block" : "none"; // Show Submit only on last question
    }

    // Check answer and allow next/submit if correct
    function checkAnswer(selected, correct) {
        speak(selected);
        if (selected === correct) {
            document.getElementById("feedback").textContent = "Correct! ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ✅ ";
            document.getElementById("feedback").style.color = "green";
            answers[currentQuestionIndex] = selected;

            // If it's the last question, enable "Submit," otherwise enable "Next"
            if (currentQuestionIndex === questions.length - 1) {
                submitBtn.style.display = "inline-block";
            } else {
                nextBtn.style.display = "inline-block";
            }
        } else {
            document.getElementById("feedback").textContent = "Try again ❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌";
            document.getElementById("feedback").style.color = "red";
            nextBtn.style.display = "none"; // Hide Next button until correct
            submitBtn.style.display = "none"; // Hide Submit if incorrect
        }
    }

    // Next button click
    nextBtn.addEventListener("click", () => {
        currentQuestionIndex++;
        displayQuestion(currentQuestionIndex);
    });

    // Previous button click
    prevBtn.addEventListener("click", () => {
        currentQuestionIndex--;
        displayQuestion(currentQuestionIndex);
    });

    // Submit button click
    submitBtn.addEventListener("click", () => {
        let correctAnswers = answers.filter(ans => ans !== null).length;
        alert(username + ", you scored " + correctAnswers + " out of " + questions.length);
    });

    // Display first question
    displayQuestion(currentQuestionIndex);
</script>
